version: '3.8'

services:

  # ── Container 1: ML Model (FastAPI & pickle) ──────────────────────────
  ml_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pbl_ml_api
    ports:
      - "8000:8000"
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
    env_file:
      - .env
    volumes:
      - ./models:/app/models   # mount folder models
    networks:
      - pbl_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Container 2: Web Dashboard: Streamlit ────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: pbl_streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000   # pakai nama service, bukan localhost!
    env_file:
      - .env
    networks:
      - pbl_network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# ── Network ───────────────────────────────────────
networks:
  pbl_network:
    driver: bridge